[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanline-screener"
version = "1.0.0"
description = "A live market screener with a quant analytics layer and an MCP server, built on TradingView data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Michael Hanko" }]
keywords = [
    "tradingview", "screener", "stock-screener", "market", "finance", "trading",
    "quant", "mcp", "model-context-protocol", "fastapi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Kept in step with requirements.txt by hand. requirements.txt stays the
# documented path for a checkout; this list is what `pip install scanline`
# resolves. pytest is deliberately not here, it lives in the dev extra.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "tradingview-screener>=3.0",
    "pandas>=2.0",
    "requests>=2.31",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/mphinance/scanline"
Showcase = "https://mphinance.github.io/scanline/"
Source = "https://github.com/mphinance/scanline"
Changelog = "https://github.com/mphinance/scanline/blob/master/CHANGELOG.md"
Issues = "https://github.com/mphinance/scanline/issues"

[project.scripts]
# The two things a user runs. Both work from a checkout via run.py and
# run_mcp.py as well, so the documented commands in CLAUDE.md keep working.
scanline = "scanline.cli:main"
scanline-mcp = "scanline.mcp_server:main"

[tool.hatch.build.targets.wheel]
# `frontend` is listed so the wheel picks it up, and `sources` rewrites it to
# scanline/static on the way in. force-include would do the same but ignores
# `exclude`, which is how *.test.mjs used to ship.
include = ["scanline", "frontend"]
exclude = ["*.test.mjs"]

# The frontend is static assets that live outside the Python package, so the
# wheel carries them inside it as scanline/static. scanline/app.py looks
# for this location when the sibling frontend/ folder of a checkout is absent.
[tool.hatch.build.targets.wheel.sources]
"frontend" = "scanline/static"
