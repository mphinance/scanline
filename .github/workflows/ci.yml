name: CI

# Runs the offline test suite on every push and PR. Live tests (marked `live`,
# they hit the real TradingView endpoint) are skipped in CI on purpose so the
# build stays deterministic and network-free.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        # pytest is declared in requirements.txt, so a bare install is enough.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python tests (offline)
        run: python -m pytest tests/ -q -m "not live"

      - name: Frontend logic tests
        # Glob, not a hand-listed pair. Naming the files meant a newly added
        # *.test.mjs was never run and CI stayed green without it.
        run: node --test frontend/js/*.test.mjs

  house-rules:
    # CLAUDE.md's rules that a reviewer should never have to check by eye.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No em dashes
        run: |
          # Built with printf rather than written literally, so this check does
          # not trip over its own source.
          dash=$(printf '\xe2\x80\x94')
          hits=$(git ls-files -z | xargs -0 grep -IlF -e "$dash" || true)
          if [ -n "$hits" ]; then
            echo "Em dashes are not allowed. Use periods and commas. Found in:"
            echo "$hits"
            exit 1
          fi

      - name: No byte order marks
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "BOM at the start of $f"
              fail=1
            fi
          done < <(git ls-files -z)
          exit $fail
