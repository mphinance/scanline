name: Release

# Tag `v*` to ship: build, test, build one-file binaries (Windows, macOS, Linux),
# push a multi-arch image to GHCR, cut a GitHub Release with the binaries attached.
# PyPI is optional: it only publishes when the repo variable PUBLISH_PYPI is "true".
# Run it by hand from the Actions tab for a dry run: that builds and tests everything
# (binaries included) and publishes nothing.
# PyPI setup and the release checklist live in RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$want" != "$have" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $have"
            exit 1
          fi

      - name: Offline tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests/ -q -m "not live"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    # One-file double-click executables. Built and smoke-tested on every run,
    # attached to the GitHub Release only on a tag.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: scanline-windows.exe
            built: scanline.exe
          - os: macos-latest
            asset: scanline-macos
            built: scanline
          - os: ubuntu-latest
            asset: scanline-linux
            built: scanline
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller packaging/scanline.spec --noconfirm

      - name: Name the artifact
        shell: bash
        run: mv "dist/${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - name: Smoke test
        shell: bash
        run: python packaging/smoke.py "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  image:
    # On a dry run this builds both architectures but pushes nothing.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dry-run,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    # Deliberately not gated on publish-pypi: PyPI is optional, and a skipped or
    # failed PyPI job must not block the release.
    needs: [build, binaries, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          pattern: scanline-*
          path: bin/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            bin/scanline-windows.exe
            bin/scanline-macos
            bin/scanline-linux
